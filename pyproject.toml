[project]
name = "edge0-studio"
version = "0.1.0"
description = "Web UI and MCP bridge for Edge0 models served by edge0-infer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "mcp>=1.1",
    "pyyaml>=6.0",
]

[project.scripts]
edge0-studio = "edge0_studio.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge0_studio"]
