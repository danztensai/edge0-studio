<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>edge0-studio</title>
<style>
:root {
  --bg: #0d1117; --panel: #161b22; --border: #30363d;
  --text: #e6edf3; --dim: #8b949e; --accent: #58a6ff;
  --user: #1f6feb22; --tool: #bb800933;
}
* { box-sizing: border-box; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.5 -apple-system, "Segoe UI", sans-serif;
  display: flex; flex-direction: column; height: 100vh;
}
header {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; border-bottom: 1px solid var(--border);
  background: var(--panel);
}
header h1 { font-size: 16px; font-weight: 600; }
#status { font-size: 13px; color: var(--dim); }
#status .ok { color: #3fb950; }
#status .bad { color: #f85149; }
header .spacer { flex: 1; }
header label { font-size: 13px; color: var(--dim); display: flex; gap: 6px; align-items: center; }
#chat {
  flex: 1; overflow-y: auto; padding: 20px;
  display: flex; flex-direction: column; gap: 12px;
  max-width: 900px; width: 100%; margin: 0 auto;
}
.msg { padding: 10px 14px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
.msg.user { background: var(--user); border: 1px solid #1f6feb55; align-self: flex-end; max-width: 80%; }
.msg.assistant { background: var(--panel); border: 1px solid var(--border); align-self: flex-start; max-width: 85%; }
.msg.tool {
  background: var(--tool); border: 1px solid #bb800955; align-self: flex-start;
  font-family: ui-monospace, monospace; font-size: 12.5px; max-width: 85%;
  color: #d4a72c;
}
.msg.thinking { color: var(--dim); font-style: italic; font-size: 13px; border: 1px dashed var(--border); align-self: flex-start; max-width: 85%; }
.msg.error { background: #f8514922; border: 1px solid #f8514966; color: #f85149; }
form {
  display: flex; gap: 8px; padding: 12px 16px;
  border-top: 1px solid var(--border); background: var(--panel);
  max-width: 900px; width: 100%; margin: 0 auto;
}
textarea {
  flex: 1; resize: none; background: var(--bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px; padding: 10px;
  font: inherit; min-height: 44px; max-height: 160px;
}
button {
  background: var(--accent); color: #0d1117; border: 0; border-radius: 8px;
  padding: 0 20px; font-weight: 600; cursor: pointer;
}
button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>edge0-studio</h1>
  <div id="status">connecting…</div>
  <div class="spacer"></div>
  <label><input type="checkbox" id="useTools" checked> MCP tools (<span id="toolCount">0</span>)</label>
  <label><input type="checkbox" id="showThinking"> thinking</label>
</header>
<div id="chat"></div>
<form id="form">
  <textarea id="input" placeholder="Message… (Enter to send, Shift+Enter for newline)" rows="1"></textarea>
  <button id="send" type="submit">Send</button>
</form>
<script>
const chatEl = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const statusEl = document.getElementById("status");
const useToolsEl = document.getElementById("useTools");
const showThinkingEl = document.getElementById("showThinking");
const toolCountEl = document.getElementById("toolCount");
const history = [];

async function refreshStatus() {
  try {
    const r = await fetch("/api/status");
    const s = await r.json();
    toolCountEl.textContent = s.tool_count;
    const up = s.upstream.reachable
      ? `<span class="ok">● ${s.upstream.model}</span>`
      : `<span class="bad">● upstream offline</span> (${s.upstream.base_url})`;
    const mcpTxt = s.mcp.length
      ? " · MCP: " + s.mcp.map(m => `${m.server}${m.connected ? "" : " (down)"}`).join(", ")
      : "";
    statusEl.innerHTML = up + mcpTxt;
  } catch { statusEl.innerHTML = '<span class="bad">● studio offline</span>'; }
}
refreshStatus();
setInterval(refreshStatus, 10000);

function addMsg(cls, text) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});

form.addEventListener("submit", async e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || sendBtn.disabled) return;
  input.value = "";
  sendBtn.disabled = true;
  addMsg("user", text);
  history.push({ role: "user", content: text });

  let assistantDiv = null, assistantText = "", thinkingDiv = null;
  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history, use_tools: useToolsEl.checked }),
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split("\n\n");
      buf = lines.pop();
      for (const block of lines) {
        if (!block.startsWith("data:")) continue;
        let ev;
        try { ev = JSON.parse(block.slice(5)); } catch { continue; }
        if (ev.type === "token") {
          if (!assistantDiv) assistantDiv = addMsg("assistant", "");
          assistantText += ev.text;
          assistantDiv.textContent = assistantText;
          chatEl.scrollTop = chatEl.scrollHeight;
        } else if (ev.type === "thinking" && showThinkingEl.checked) {
          if (!thinkingDiv) thinkingDiv = addMsg("thinking", "");
          thinkingDiv.textContent += ev.text;
        } else if (ev.type === "tool_call") {
          addMsg("tool", `→ ${ev.name}(${ev.arguments})`);
        } else if (ev.type === "tool_result") {
          const preview = ev.result.length > 600 ? ev.result.slice(0, 600) + "…" : ev.result;
          addMsg("tool", `← ${ev.name}: ${preview}`);
        } else if (ev.type === "error") {
          addMsg("error", ev.message);
        }
      }
    }
    if (assistantText) history.push({ role: "assistant", content: assistantText });
  } catch (err) {
    addMsg("error", "request failed: " + err);
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
