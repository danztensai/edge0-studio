<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>edge0-studio</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.0/dist/purify.min.js"></script>
<style>
:root {
  --bg: #0d1117; --panel: #161b22; --panel2: #1c2128; --border: #30363d;
  --text: #e6edf3; --dim: #8b949e; --accent: #58a6ff; --accent-dim: #1f6feb;
  --green: #3fb950; --red: #f85149; --yellow: #d4a72c;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 14.5px/1.55 -apple-system, "Segoe UI", sans-serif;
  display: flex; overflow: hidden;
}
button { font: inherit; cursor: pointer; }

/* ── Sidebar ─────────────────────────────── */
#sidebar {
  width: 260px; min-width: 260px; background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
}
#sidebar.collapsed { display: none; }
#sidebar .brand {
  padding: 14px 16px; font-weight: 700; font-size: 15px;
  border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px;
}
#sidebar .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
#sidebar .brand .dot.ok { background: var(--green); }
#newChat {
  margin: 10px 12px; padding: 8px; border-radius: 8px;
  background: var(--accent-dim); color: #fff; border: 0; font-weight: 600;
}
#convList { flex: 1; overflow-y: auto; padding: 4px 8px; }
.conv {
  padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 13.5px;
  color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  display: flex; align-items: center; gap: 6px;
}
.conv:hover { background: var(--panel2); color: var(--text); }
.conv.active { background: var(--panel2); color: var(--text); font-weight: 600; }
.conv .title { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.conv .del { visibility: hidden; background: none; border: 0; color: var(--dim); padding: 2px 4px; }
.conv:hover .del { visibility: visible; }
.conv .del:hover { color: var(--red); }
#sideFoot {
  padding: 10px 14px; border-top: 1px solid var(--border);
  font-size: 12px; color: var(--dim);
}

/* ── Main ────────────────────────────────── */
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#topbar {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--panel);
}
#topbar .icon-btn {
  background: none; border: 1px solid var(--border); border-radius: 6px;
  color: var(--dim); padding: 4px 9px;
}
#topbar .icon-btn:hover { color: var(--text); border-color: var(--dim); }
#modelSel {
  background: var(--panel2); color: var(--text); border: 1px solid var(--border);
  border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 13px; max-width: 220px;
}
#topStatus { font-size: 12.5px; color: var(--dim); }
#topbar .spacer { flex: 1; }
#topbar label { font-size: 12.5px; color: var(--dim); display: flex; gap: 5px; align-items: center; }

/* ── Chat ────────────────────────────────── */
#chatWrap { flex: 1; overflow-y: auto; }
#chat { max-width: 860px; margin: 0 auto; padding: 24px 20px 10px; display: flex; flex-direction: column; gap: 14px; }
#empty {
  margin: auto; text-align: center; color: var(--dim); padding-top: 18vh;
}
#empty h2 { color: var(--text); margin-bottom: 8px; font-size: 20px; }
.msg { border-radius: 10px; max-width: 92%; }
.msg.user {
  background: var(--accent-dim); color: #fff; align-self: flex-end;
  padding: 10px 14px; white-space: pre-wrap; word-break: break-word;
}
.msg.assistant { align-self: flex-start; width: 100%; }
.msg.assistant .md {
  background: var(--panel); border: 1px solid var(--border);
  padding: 12px 16px; border-radius: 10px; word-break: break-word;
}
.md p, .md ul, .md ol, .md pre, .md table, .md blockquote { margin: 0 0 10px; }
.md > :last-child { margin-bottom: 0; }
.md pre {
  background: #0a0d12; border: 1px solid var(--border); border-radius: 8px;
  padding: 12px; overflow-x: auto; font-size: 13px;
}
.md code { font-family: ui-monospace, "Cascadia Code", monospace; font-size: .92em; background: #0a0d12; padding: 1px 5px; border-radius: 4px; }
.md pre code { background: none; padding: 0; }
.md table { border-collapse: collapse; }
.md th, .md td { border: 1px solid var(--border); padding: 5px 10px; }
.md blockquote { border-left: 3px solid var(--border); padding-left: 12px; color: var(--dim); }
.md a { color: var(--accent); }
.stats { font-size: 11.5px; color: var(--dim); margin-top: 5px; padding-left: 4px; }

details.block {
  align-self: flex-start; max-width: 92%; width: fit-content;
  border: 1px solid var(--border); border-radius: 8px; overflow: hidden; font-size: 12.5px;
}
details.block summary {
  cursor: pointer; padding: 6px 12px; background: var(--panel2);
  color: var(--dim); list-style: none; user-select: none;
}
details.block summary::before { content: "▸ "; }
details.block[open] summary::before { content: "▾ "; }
details.block .body {
  padding: 8px 12px; white-space: pre-wrap; word-break: break-word;
  font-family: ui-monospace, monospace; max-height: 260px; overflow-y: auto;
}
details.tool summary { color: var(--yellow); }
details.think .body { font-family: inherit; font-style: italic; color: var(--dim); }
.msg.error { background: #f8514922; border: 1px solid #f8514966; color: var(--red); padding: 10px 14px; align-self: flex-start; }
.typing { color: var(--dim); font-size: 13px; align-self: flex-start; padding-left: 4px; }
.typing .d { animation: blink 1.2s infinite; } .typing .d:nth-child(2) { animation-delay: .2s } .typing .d:nth-child(3) { animation-delay: .4s }
@keyframes blink { 0%,60%,100% { opacity: .25 } 30% { opacity: 1 } }

/* ── Composer ────────────────────────────── */
#composer { border-top: 1px solid var(--border); background: var(--panel); }
#composer .inner { max-width: 860px; margin: 0 auto; padding: 12px 20px; display: flex; gap: 10px; align-items: flex-end; }
#input {
  flex: 1; resize: none; background: var(--panel2); color: var(--text);
  border: 1px solid var(--border); border-radius: 10px; padding: 11px 14px;
  font: inherit; min-height: 46px; max-height: 200px; outline: none;
}
#input:focus { border-color: var(--accent-dim); }
#sendBtn, #stopBtn {
  border: 0; border-radius: 10px; padding: 11px 22px; font-weight: 600; height: 46px;
}
#sendBtn { background: var(--accent-dim); color: #fff; }
#sendBtn:disabled { opacity: .45; cursor: default; }
#stopBtn { background: var(--red); color: #fff; display: none; }

/* ── Settings drawer ─────────────────────── */
#settings {
  position: fixed; top: 0; right: -340px; width: 340px; height: 100%;
  background: var(--panel); border-left: 1px solid var(--border);
  transition: right .2s ease; z-index: 20; display: flex; flex-direction: column;
}
#settings.open { right: 0; }
#settings header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
#settings header button { background: none; border: 0; color: var(--dim); font-size: 18px; }
#settings .body { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
#settings label { font-size: 12.5px; color: var(--dim); display: block; margin-bottom: 5px; }
#settings textarea, #settings input[type=number] {
  width: 100%; background: var(--panel2); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 13.5px;
}
#settings textarea { resize: vertical; min-height: 90px; }
.mcp-item { font-size: 13px; padding: 7px 10px; background: var(--panel2); border-radius: 8px; margin-bottom: 6px; }
.mcp-item .nm { font-weight: 600; }
.mcp-item .tl { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>

<aside id="sidebar">
  <div class="brand"><span class="dot" id="connDot"></span>edge0-studio</div>
  <button id="newChat">＋ New chat</button>
  <div id="convList"></div>
  <div id="sideFoot" title="upstream server"></div>
</aside>

<div id="main">
  <div id="topbar">
    <button class="icon-btn" id="toggleSide" title="Toggle sidebar">☰</button>
    <select id="modelSel"><option>loading…</option></select>
    <span id="topStatus"></span>
    <div class="spacer"></div>
    <label><input type="checkbox" id="useTools" checked> Tools (<span id="toolCount">0</span>)</label>
    <label><input type="checkbox" id="showThinking"> Thinking</label>
    <button class="icon-btn" id="openSettings" title="Settings">⚙</button>
  </div>

  <div id="chatWrap"><div id="chat">
    <div id="empty"><h2>edge0-studio</h2><p>Local Edge0 model + MCP tools.<br>First message pays a prefill cost on CPU — follow-ups are fast.</p></div>
  </div></div>

  <div id="composer"><div class="inner">
    <textarea id="input" placeholder="Message… (Enter to send, Shift+Enter for newline)" rows="1"></textarea>
    <button id="sendBtn">Send</button>
    <button id="stopBtn">Stop</button>
  </div></div>
</div>

<div id="settings">
  <header>Settings <button id="closeSettings">✕</button></header>
  <div class="body">
    <div>
      <label for="sysPrompt">System prompt</label>
      <textarea id="sysPrompt" placeholder="You are a helpful assistant…"></textarea>
    </div>
    <div>
      <label for="temp">Temperature (empty = model default)</label>
      <input type="number" id="temp" step="0.1" min="0" max="2" placeholder="default">
    </div>
    <div>
      <label>MCP servers</label>
      <div id="mcpList"><div class="mcp-item tl">none configured</div></div>
      <div class="tl" style="font-size:12px;color:var(--dim);margin-top:6px">
        Edit <code id="cfgPath"></code> and restart to change.
      </div>
    </div>
  </div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const chatEl = $("chat"), input = $("input"), sendBtn = $("sendBtn"), stopBtn = $("stopBtn");
marked.setOptions({ breaks: true });
const md = t => DOMPurify.sanitize(marked.parse(t));

/* ── Conversation store (localStorage) ───── */
const store = {
  key: "edge0-studio.convs",
  load() { try { return JSON.parse(localStorage.getItem(this.key)) || []; } catch { return []; } },
  save(c) { localStorage.setItem(this.key, JSON.stringify(c)); },
};
let convs = store.load();          // [{id,title,messages:[{role,content}],ts}]
let activeId = null;
let aborter = null;

function activeConv() { return convs.find(c => c.id === activeId); }
function newConv() {
  const c = { id: Date.now().toString(36), title: "New chat", messages: [], ts: Date.now() };
  convs.unshift(c); activeId = c.id; store.save(convs);
  renderSidebar(); renderChat();
}
function deleteConv(id) {
  convs = convs.filter(c => c.id !== id); store.save(convs);
  if (activeId === id) { activeId = convs[0]?.id ?? null; if (!activeId) return newConv(); }
  renderSidebar(); renderChat();
}
function renderSidebar() {
  const list = $("convList"); list.innerHTML = "";
  for (const c of convs) {
    const div = document.createElement("div");
    div.className = "conv" + (c.id === activeId ? " active" : "");
    const t = document.createElement("span"); t.className = "title"; t.textContent = c.title;
    const del = document.createElement("button"); del.className = "del"; del.textContent = "✕";
    del.onclick = e => { e.stopPropagation(); deleteConv(c.id); };
    div.append(t, del);
    div.onclick = () => { if (aborter) return; activeId = c.id; renderSidebar(); renderChat(); };
    list.appendChild(div);
  }
}

/* ── Rendering ───────────────────────────── */
function el(tag, cls, text) {
  const d = document.createElement(tag); if (cls) d.className = cls;
  if (text !== undefined) d.textContent = text; return d;
}
function addUser(text) { const d = el("div", "msg user", text); chatEl.appendChild(d); scroll(); return d; }
function addAssistant() {
  const wrap = el("div", "msg assistant");
  const body = el("div", "md");
  wrap.appendChild(body); chatEl.appendChild(wrap); scroll();
  return { wrap, body };
}
function addBlock(cls, label, content) {
  const d = document.createElement("details"); d.className = "block " + cls;
  const s = el("summary", null, label); const b = el("div", "body", content);
  d.append(s, b); chatEl.appendChild(d); scroll(); return b;
}
function addError(text) { chatEl.appendChild(el("div", "msg error", text)); scroll(); }
function scroll() { $("chatWrap").scrollTop = $("chatWrap").scrollHeight; }

function renderChat() {
  chatEl.innerHTML = "";
  const c = activeConv();
  if (!c || !c.messages.length) {
    const e = document.createElement("div"); e.id = "empty";
    e.innerHTML = "<h2>edge0-studio</h2><p>Local Edge0 model + MCP tools.</p>";
    chatEl.appendChild(e);
    return;
  }
  for (const m of c.messages) {
    if (m.role === "user") addUser(m.content);
    else if (m.role === "assistant") {
      const { body } = addAssistant(); body.innerHTML = md(m.content || "");
      if (m.stats) appendStats(body.parentElement, m.stats);
    }
  }
  scroll();
}
function appendStats(wrapEl, s) {
  const parts = [];
  if (s.tokens_per_second) parts.push(s.tokens_per_second + " tok/s");
  if (s.first_token_seconds != null) parts.push("first token " + s.first_token_seconds + "s");
  if (s.tokens) parts.push(s.tokens + " tokens");
  if (parts.length) wrapEl.appendChild(el("div", "stats", parts.join(" · ")));
}

/* ── Status ──────────────────────────────── */
async function refreshStatus() {
  try {
    const s = await (await fetch("/api/status")).json();
    $("connDot").classList.toggle("ok", s.upstream.reachable);
    $("toolCount").textContent = s.tool_count;
    $("topStatus").textContent = s.upstream.reachable ? "" : "upstream offline — start edge0-infer serve";
    $("sideFoot").textContent = s.upstream.base_url;
    $("cfgPath").textContent = s.config_path;
    const sel = $("modelSel");
    const current = sel.value;
    sel.innerHTML = "";
    const models = s.upstream.models.length ? s.upstream.models : [s.upstream.model];
    for (const m of models) { const o = document.createElement("option"); o.value = o.textContent = m; sel.appendChild(o); }
    if (models.includes(current)) sel.value = current;
    const mcpL = $("mcpList"); mcpL.innerHTML = "";
    if (!s.mcp.length) mcpL.innerHTML = '<div class="mcp-item tl">none configured</div>';
    for (const m of s.mcp) {
      const d = el("div", "mcp-item");
      d.innerHTML = `<span class="nm">${m.server}</span> ${m.connected ? "🟢" : "🔴"}<div class="tl">${(m.tools||[]).join(", ") || "no tools"}</div>`;
      mcpL.appendChild(d);
    }
  } catch { $("connDot").classList.remove("ok"); }
}

/* ── Send / stream ───────────────────────── */
async function send() {
  const text = input.value.trim();
  if (!text || aborter) return;
  const conv = activeConv() || (newConv(), activeConv());
  $("empty")?.remove();
  input.value = ""; autoGrow();

  conv.messages.push({ role: "user", content: text });
  if (conv.title === "New chat") { conv.title = text.slice(0, 42); renderSidebar(); }
  store.save(convs);
  addUser(text);

  const typing = el("div", "typing");
  typing.innerHTML = 'thinking<span class="d">.</span><span class="d">.</span><span class="d">.</span>';
  chatEl.appendChild(typing); scroll();

  sendBtn.style.display = "none"; stopBtn.style.display = "block";
  aborter = new AbortController();

  let aDiv = null, aText = "", thinkBody = null, stats = null;
  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      signal: aborter.signal,
      body: JSON.stringify({
        messages: conv.messages.map(({role, content}) => ({role, content})),
        use_tools: $("useTools").checked,
        model: $("modelSel").value || null,
        system_prompt: $("sysPrompt").value,
        temperature: $("temp").value === "" ? null : parseFloat($("temp").value),
      }),
    });
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const frames = buf.split("\n\n"); buf = frames.pop();
      for (const f of frames) {
        if (!f.startsWith("data:")) continue;
        let ev; try { ev = JSON.parse(f.slice(5)); } catch { continue; }
        typing.remove();
        if (ev.type === "token") {
          if (!aDiv) aDiv = addAssistant();
          aText += ev.text; aDiv.body.innerHTML = md(aText); scroll();
        } else if (ev.type === "thinking") {
          if ($("showThinking").checked) {
            if (!thinkBody) thinkBody = addBlock("think", "thinking", "");
            thinkBody.textContent += ev.text; scroll();
          }
        } else if (ev.type === "tool_call") {
          addBlock("tool", "→ " + ev.name, ev.arguments);
          chatEl.appendChild(typing); scroll();
        } else if (ev.type === "tool_result") {
          addBlock("tool", "← " + ev.name, ev.result);
          chatEl.appendChild(typing); scroll();
        } else if (ev.type === "error") {
          addError(ev.message);
        } else if (ev.type === "done") {
          stats = ev.stats || null;
        }
      }
    }
  } catch (err) {
    if (err.name !== "AbortError") addError("request failed: " + err);
  } finally {
    typing.remove();
    if (aText) {
      conv.messages.push({ role: "assistant", content: aText, stats });
      if (stats && aDiv) appendStats(aDiv.wrap, stats);
      store.save(convs);
    }
    aborter = null;
    sendBtn.style.display = "block"; stopBtn.style.display = "none";
    input.focus();
  }
}

/* ── Wiring ──────────────────────────────── */
function autoGrow() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 200) + "px"; }
input.addEventListener("input", autoGrow);
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
sendBtn.onclick = send;
stopBtn.onclick = () => aborter?.abort();
$("newChat").onclick = () => { if (!aborter) newConv(); };
$("toggleSide").onclick = () => $("sidebar").classList.toggle("collapsed");
$("openSettings").onclick = () => $("settings").classList.add("open");
$("closeSettings").onclick = () => $("settings").classList.remove("open");
["sysPrompt", "temp"].forEach(id => {
  $(id).value = localStorage.getItem("edge0-studio." + id) || "";
  $(id).addEventListener("change", () => localStorage.setItem("edge0-studio." + id, $(id).value));
});

if (!convs.length) newConv(); else { activeId = convs[0].id; renderSidebar(); renderChat(); }
refreshStatus(); setInterval(refreshStatus, 10000);
</script>
</body>
</html>
